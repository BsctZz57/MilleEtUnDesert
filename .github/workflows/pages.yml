name: Publier le site (avec avis Google)

# Récupère les avis Google côté serveur (clé dans les secrets du dépôt, jamais dans le site),
# puis publie le site sur GitHub Pages. Tourne à chaque push, chaque jour, ou à la demande.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 5h UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PLACE_ID: ChIJIbMt8lZCvq8RnAc2OxVFldo   # Mille et un Désert — Djanet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les avis Google (FR + EN)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          for lang in fr en; do
            out="reviews.$lang.json"
            if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
              echo "Secret GOOGLE_PLACES_API_KEY absent : pas d'avis publiés ($lang)."
              continue
            fi
            if curl -sSf -m 20 \
                -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" \
                -H "X-Goog-FieldMask: rating,userRatingCount,reviews" \
                "https://places.googleapis.com/v1/places/$PLACE_ID?languageCode=$lang" -o "$out" \
               && jq -e 'has("rating")' "$out" > /dev/null; then
              echo "Avis $lang : OK ($(jq '.reviews | length' "$out") avis)"
            else
              echo "::warning::Récupération des avis $lang impossible (facturation Google ? clé ?). Site publié sans avis."
              rm -f "$out"
            fi
          done

      - name: Préparer le site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' --exclude 'config.js' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
